[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "cmake>=3.18",
]
build-backend = "setuptools.build_meta"

[project]
name = "liteocr"
version = "0.1.0"
description = "Python wrapper for LiteOCR"
readme = "Readme.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "LiteOCR Contributors"},
]
keywords = ["ocr", "liteocr", "ncnn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/futz12/LiteOCR"
